# Runs the project the way a stranger would: a clean checkout, nothing cached.
# The frontend once shipped with every `const` turned into `whatnst` and
# nobody noticed locally because the browser served old copies - a syntax
# check on every script the pages load catches that class of break.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install numpy websockets pytest
      - name: Byte-compile every module
        run: python -m compileall -q src
      - name: Tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check every script the pages load
        run: for f in web/*.js; do node --check "$f" || exit 1; done
