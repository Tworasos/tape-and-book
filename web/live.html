<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tape &amp; Book — LIVE</title>
<style>
:root{
  --bg:#080b11; --panel:#0e131c; --panel2:#131a26; --line:#1e2836;
  --ink:#c7d3e3; --dim:#6b7a8f; --accent:#4a9eff;
  --bid:#26a69a; --ask:#ef5350; --warn:#e0a33e; --poc:#8b6fd4;
  --mono:"Cascadia Mono","Consolas","SF Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:12px/1.45 var(--mono);overflow:hidden}
#app{display:grid;height:100vh;max-width:100vw;overflow:hidden;
  /* The main column must never collapse: min-width:0 on grid children lets
     it shrink to zero on a narrow window, and a 0-wide canvas draws nothing.
     minmax() floors it; the side columns give way instead. */
  grid-template-columns:minmax(340px,1fr) minmax(0,150px) minmax(0,138px) minmax(0,214px) minmax(0,236px);
  grid-template-rows:38px minmax(160px,1fr) minmax(110px,146px) 182px;
  grid-template-areas:
    "top    top    top    top   top"
    "heat   dom    foot   deci  bot"
    "cvd    dom    foot   deci  bot"
    "trades events events deci  bot";
  gap:1px;background:var(--line)}
#top{grid-area:top;background:var(--panel);display:flex;align-items:center;gap:13px;
  padding:0 12px;overflow-x:auto;white-space:nowrap}
.brand{font-weight:700;letter-spacing:.06em;color:var(--accent);flex:none}
select,button,a.btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
  font:inherit;padding:3px 7px;border-radius:2px;cursor:pointer;text-decoration:none}
select:hover,button:hover,a.btn:hover{border-color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ask);display:inline-block;margin-right:5px}
.dot.on{background:var(--bid);box-shadow:0 0 6px var(--bid)}
.stat{flex:none;color:var(--dim)} .stat b{color:var(--ink);font-weight:600}
b.up,.up{color:var(--bid)} b.dn,.dn{color:var(--ask)}
.grow{flex:1}
.panel{background:var(--panel);overflow:hidden;display:flex;flex-direction:column;min-height:0;min-width:0}
.hd{flex:none;padding:4px 9px;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--dim);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.hd em{font-style:normal;color:var(--accent);text-transform:none;letter-spacing:0}
.body{flex:1;overflow:auto;min-height:0;min-width:0}
.cwrap{position:relative;flex:1;min-height:0}
canvas{display:block;width:100%;height:100%}
#heat{grid-area:heat} #dom{grid-area:dom} #foot{grid-area:foot}
#deci{grid-area:deci} #cvd{grid-area:cvd}
#trades{grid-area:trades} #events{grid-area:events} #bot{grid-area:bot}
table{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
th{position:sticky;top:0;background:var(--panel2);color:var(--dim);font-weight:500;
  text-align:right;padding:3px 7px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;z-index:1}
th:first-child,td:first-child{text-align:left}
td{padding:2px 6px;text-align:right;border-bottom:1px solid #141c28;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.buy{color:var(--bid)} .sell{color:var(--ask)}
.empty{padding:14px 10px;color:var(--dim);text-align:center;line-height:1.7;font-size:11px}
.verdict{padding:11px 12px;border-bottom:1px solid var(--line)}
.verdict .act{font-size:19px;font-weight:700;letter-spacing:.03em}
.verdict .act.buy{color:var(--bid)} .verdict .act.sell{color:var(--ask)}
.verdict .act.wait{color:var(--dim)}
.verdict .sc{color:var(--dim);margin-top:3px;font-size:11px}
.bar{height:7px;background:var(--panel2);border-radius:4px;margin-top:9px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b{background:var(--bid)} .bar .s{background:var(--ask)}
.obs{padding:4px 9px;border-bottom:1px solid #141c28;display:flex;gap:7px;align-items:baseline}
.obs .w{flex:none;width:36px;text-align:right;font-weight:600}
.obs .n{flex:none;color:var(--ink)}
.obs .d{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}
.src{font-size:9px;padding:1px 4px;border-radius:2px;background:var(--panel2);color:var(--dim)}
.src.book{background:#16293a;color:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:10.5px;color:var(--dim)}
.kv b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.note{padding:6px 9px;font-size:10px;color:var(--warn);border-top:1px solid var(--line);line-height:1.5}

/* Narrow screens: drop the side panels rather than squeezing the heatmap
   into nothing. Everything essential stays reachable. */
@media (max-width:1250px){
  #app{grid-template-columns:minmax(320px,1fr) minmax(0,190px) minmax(0,236px);
       grid-template-areas:
         "top    top    top"
         "heat   dom    deci"
         "cvd    dom    deci"
         "trades events bot";}
  #foot{display:none}
}
@media (max-width:820px){
  #app{grid-template-columns:1fr;
       grid-template-rows:38px minmax(220px,1fr) 130px 170px 190px;
       grid-template-areas:"top" "heat" "cvd" "deci" "bot";}
  #dom,#foot,#trades,#events{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="brand">TAPE &amp; BOOK · LIVE</span>
    <select id="symSel"></select>
    <span><span class="dot" id="dot"></span><span id="conn">connecting…</span></span>
    <a class="btn" href="/">← history</a>
    <a class="btn" href="/learn">learning</a>
    <span class="grow"></span>
    <span class="stat">bid <b class="up" id="sBid">—</b></span>
    <span class="stat">ask <b class="dn" id="sAsk">—</b></span>
    <span class="stat">micro <b id="sMicro">—</b></span>
    <span class="stat">book <b id="sImb">—</b></span>
    <span class="stat">delta <b id="sDelta">—</b></span>
    <span class="stat">CVD <b id="sCvd">—</b></span>
    <span class="stat">tick <b id="sTick">—</b></span>
    <span class="stat">msgs <b id="sMsg">0</b></span>
  </div>

  <div id="heat" class="panel">
    <div class="hd">Liquidity heatmap <em>live order book depth</em></div>
    <div class="cwrap"><canvas id="heatC"></canvas></div>
  </div>

  <div id="cvd" class="panel">
    <div class="hd">CVD <em id="cvdInfo"></em></div>
    <div class="cwrap"><canvas id="cvdC"></canvas></div>
  </div>

  <div id="dom" class="panel">
    <div class="hd">DOM</div>
    <div class="cwrap"><canvas id="domC"></canvas></div>
  </div>

  <div id="foot" class="panel">
    <div class="hd">Footprint <em id="footInfo"></em></div>
    <div class="cwrap"><canvas id="footC"></canvas></div>
  </div>

  <div id="deci" class="panel">
    <div class="hd">Decision <em id="deciMode"></em></div>
    <div class="verdict">
      <div class="act wait" id="act">WAIT</div>
      <div class="sc" id="sc">—</div>
      <div class="bar"><i class="b" id="barB" style="width:0"></i><i class="s" id="barS" style="width:0"></i></div>
    </div>
    <div class="body" id="obsList"></div>
    <div class="note" id="deciNote"></div>
  </div>

  <div id="bot" class="panel">
    <div class="hd">Demo bot <em id="botMode"></em></div>
    <div class="verdict">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="color:var(--dim);font-size:10px;letter-spacing:.1em">EQUITY</span>
        <span id="botEq" style="font-size:19px;font-weight:700">—</span>
      </div>
      <div class="sc"><span id="botPnl">—</span> · <span id="botLeft">—</span></div>
      <div class="bar"><i class="b" id="botBar" style="width:50%"></i></div>
      <div class="kv"><span>next position</span><b id="botNext">—</b></div>
      <div class="kv"><span>peak equity</span><b id="botPeak">—</b></div>
      <div class="kv"><span>max drawdown</span><b id="botDd" class="dim">—</b></div>
    </div>
    <div id="botPos" class="verdict" style="display:none"></div>
    <div class="body" id="botTrades"></div>
    <div style="padding:6px 9px;border-top:1px solid var(--line);display:flex;gap:5px;flex-wrap:wrap">
      <button id="botToggle">pause</button>
      <button id="botReset">reset</button>
      <button id="botCosts">enable fees</button>
      <button id="botCompound">fixed size</button>
    </div>
    <div class="note" id="botNote"></div>
  </div>

  <div id="trades" class="panel">
    <div class="hd">Tape <em id="tapeInfo"></em></div>
    <div class="body" id="tradeBody"></div>
  </div>

  <div id="events" class="panel">
    <div class="hd">Book / large orders / sweeps <em id="evInfo"></em></div>
    <div class="body" id="evBody"></div>
  </div>
</div>
<script src="/live.js"></script>
</body>
</html>
